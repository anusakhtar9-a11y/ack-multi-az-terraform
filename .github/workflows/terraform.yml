name: "Terraform Multi-AZ ACK Deployment"

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Deploy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init
        working-directory: ./ack-multi-az-lab

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./ack-multi-az-lab

      - name: Terraform Plan
        run: terraform plan -var="node_password=${{ secrets.NODE_PASSWORD }}"
        working-directory: ./ack-multi-az-lab
        env:
          ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
          ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -var="node_password=${{ secrets.NODE_PASSWORD }}"
        working-directory: ./ack-multi-az-lab
        env:
          ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
          ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}